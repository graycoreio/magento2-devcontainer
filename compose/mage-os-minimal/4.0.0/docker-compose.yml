services:
  php:
    image: mappia/magento-php:devcontainer8.5
    environment:
      - PHP_IDE_CONFIG=serverName=magento
      - CONFIG__DEFAULT__CATALOG__SEARCH__OPENSEARCH_SERVER_HOSTNAME=opensearch
      - CONFIG__DEFAULT__CATALOG__SEARCH__ENGINE=opensearch
      - CONFIG__DEFAULT__CATALOG__SEARCH__OPENSEARCH_SERVER_PORT=9200
      # GitHub Codespaces' port-forwarder rewrites Host to localhost:<port>
      # and puts the real hostname in X-Forwarded-Host, which Magento doesn't
      # honor — causing an ERR_TOO_MANY_REDIRECTS loop on canonical redirect.
      - CONFIG__DEFAULT__WEB__URL__REDIRECT_TO_BASE=0
    networks:
      - magento
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.30
    environment:
      - MAGENTO2_UPSTREAM=php
      - MAGENTO2_UPSTREAM_PORT=9000
      - NGINX_PORT=8000
      - NGINX_TLS_PORT=8443
      - MAGENTO_TLS_CERT=snakeoil.crt
      - MAGENTO_TLS_KEY=snakeoil.key
    ports:
      - "8000:8000"
      - "8443:8443"
    networks:
      - magento
    depends_on:
      - php

  db:
    image: mariadb:12.3
    environment:
      MYSQL_ROOT_PASSWORD: magento
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - magento
    command: --max_allowed_packet=256M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  opensearch:
    image: opensearchproject/opensearch:3
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=TH65Fda4IIZoNVSAF6R0lgP&
      - plugins.security.disabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - magento
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  redis:
    image: valkey/valkey:9
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - magento
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.29.0
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - magento

volumes:
  db_data:
  opensearch_data:
  redis_data:

networks:
  magento:
    driver: bridge
