name: Test Existing Project

# Reusable workflow: runs the "user already has a project, init.sh auto-detects"
# flow against a supported-version matrix. Called from ci.yml once per
# distribution (magento-open-source, mage-os, mage-os-minimal).

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON matrix produced by graycoreio/.../supported-version
        required: true
        type: string
      has_rabbitmq:
        description: Whether the compose stack ships rabbitmq (skip the check otherwise)
        required: false
        type: boolean
        default: true
      repository_url:
        description: Composer repository URL used for `composer create-project`
                     (mage-os/* packages need repo.mage-os.org; vanilla Magento
                     uses mirror.mage-os.org).
        required: false
        type: string
        default: https://mirror.mage-os.org/

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    name: ${{ matrix.magento }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Create Magento project
        run: |
          composer create-project --no-install \
            --repository-url="${{ inputs.repository_url }}" \
            "${{ matrix.magento }}" test-project

      - name: Checkout devcontainer
        uses: actions/checkout@v6
        with:
          path: test-project/.devcontainer/magento2-devcontainer

      - name: Initialize devcontainer configuration
        working-directory: test-project
        run: |
          # Run init.sh - it will auto-detect the distribution + version
          # from composer.json. Just need to provide the devcontainer name
          # (empty = default).
          printf '\n' | .devcontainer/magento2-devcontainer/bin/init.sh

          echo "=== devcontainer.json ==="
          cat .devcontainer/devcontainer.json

      - name: Build and start devcontainer
        working-directory: test-project
        run: |
          devcontainer up --workspace-folder .

      - name: Verify services are running
        working-directory: test-project
        run: |
          echo "Waiting for OpenSearch to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:9200/_cluster/health | grep -q "status"; do sleep 5; done'
          echo "OpenSearch is ready"

          echo "=== Checking PHP ==="
          devcontainer exec --workspace-folder . php -v

          echo "=== Checking database ==="
          devcontainer exec --workspace-folder . \
            bash -c 'mysql -h db -umagento -pmagento -e "SELECT 1" magento'

          echo "=== Checking OpenSearch ==="
          devcontainer exec --workspace-folder . \
            bash -c 'curl -s http://opensearch:9200/_cluster/health'

          echo ""
          echo "=== Checking Redis ==="
          devcontainer exec --workspace-folder . \
            bash -c 'redis-cli -h redis ping'

      - name: Verify RabbitMQ
        if: ${{ inputs.has_rabbitmq }}
        working-directory: test-project
        run: |
          echo "=== Checking RabbitMQ ==="
          devcontainer exec --workspace-folder . \
            bash -c 'curl -s -u magento:magento http://rabbitmq:15672/api/overview | head -c 200'
          echo ""

      - name: Verify RabbitMQ is absent (minimal)
        if: ${{ !inputs.has_rabbitmq }}
        working-directory: test-project
        run: |
          echo "=== Confirming RabbitMQ is NOT running ==="
          if devcontainer exec --workspace-folder . bash -c 'timeout 2 bash -c ">/dev/tcp/rabbitmq/5672" 2>/dev/null'; then
            echo "ERROR: rabbitmq port reachable in a stack that shouldn't have it." >&2
            exit 1
          fi
          echo "OK — no rabbitmq, as expected for the minimal stack."

      - name: Install Magento dependencies
        working-directory: test-project
        run: |
          devcontainer exec --workspace-folder . composer install

      - name: Run setup-install.sh
        working-directory: test-project
        run: |
          echo "=== Generated setup:install command ==="
          devcontainer exec --workspace-folder . \
            bash -c '.devcontainer/magento2-devcontainer/bin/setup-install.sh'

          echo ""
          echo "=== Running Magento setup:install ==="
          devcontainer exec --workspace-folder . \
            bash -c '.devcontainer/magento2-devcontainer/bin/setup-install.sh | bash'

      - name: Verify Magento installation
        working-directory: test-project
        run: |
          echo "=== Checking Magento version ==="
          devcontainer exec --workspace-folder . bin/magento --version

          echo "=== Checking Magento status ==="
          devcontainer exec --workspace-folder . bin/magento setup:db:status

      - name: Show container status
        if: always()
        working-directory: test-project
        run: |
          docker ps -a
